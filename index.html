
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIVERSO PUNDARIKE</title>

<style>
:root{
  --fondo:#10070b;
  --panel:#211016;
  --bordo:#481522;
  --rojo:#b51e3b;
  --dorado:#d6b36b;
  --texto:#f4e8dc;
  --suave:#c4aaa9;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top,#40121f 0%,#180a11 45%,#0b0609 100%);
  color:var(--texto);
  font-family:Georgia,serif;
  min-height:100vh;
}
header{
  text-align:center;
  padding:48px 15px 30px;
}
header h1{
  color:var(--dorado);
  font-size:clamp(30px,7vw,48px);
  letter-spacing:4px;
  margin:0 0 12px;
}
header p{
  color:var(--suave);
  letter-spacing:2px;
  font-size:13px;
}
main{
  width:min(950px,94%);
  margin:auto;
  padding-bottom:50px;
}
.intro{
  text-align:center;
  color:var(--suave);
  line-height:1.7;
  margin:10px auto 35px;
  max-width:650px;
}
.seccion{
  background:linear-gradient(145deg,#28121b,#170b11);
  border:1px solid #633044;
  border-radius:15px;
  padding:24px 18px;
  margin:22px 0;
  box-shadow:0 10px 30px #0006;
}
h2{
  text-align:center;
  color:var(--dorado);
  letter-spacing:2px;
  font-size:22px;
  margin:0 0 22px;
}
.botones{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
button{
  border:1px solid var(--dorado);
  background:linear-gradient(145deg,#68172c,#35101c);
  color:#fff0dc;
  border-radius:9px;
  padding:15px 8px;
  font-family:Georgia,serif;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}
button:hover{
  background:linear-gradient(145deg,#a51e3b,#591226);
  transform:translateY(-2px);
}
.pregunta{
  display:block;
  width:100%;
  margin:0 0 18px;
  padding:13px;
  border:1px solid #714052;
  border-radius:8px;
  background:#12090e;
  color:white;
  font-family:Georgia,serif;
  font-size:15px;
}
.pregunta::placeholder{color:#aa9298}
#resultado{
  margin-top:28px;
  display:none;
}
.tituloResultado{
  color:var(--dorado);
  text-align:center;
  font-size:23px;
  letter-spacing:2px;
  margin:20px 0;
}
.preguntaMostrada{
  text-align:center;
  color:var(--suave);
  font-style:italic;
  margin-bottom:25px;
}
.cartas{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
}
.carta{
  background:linear-gradient(160deg,#351522,#180b12);
  border:1px solid #9b6c55;
  border-radius:12px;
  padding:20px 15px;
  text-align:center;
  min-width:0;
}
.numero{
  color:var(--dorado);
  font-size:13px;
  letter-spacing:2px;
}
.simbolo{
  font-size:35px;
  color:var(--dorado);
  margin:12px 0;
}
.nombreCarta{
  color:#f3d59b;
  font-size:19px;
  letter-spacing:1px;
  margin:8px 0;
}
.orientacion{
  display:inline-block;
  background:#4a1728;
  color:#f1c8a0;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  margin:5px 0 12px;
}
.posicion{
  color:var(--dorado);
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:12px;
}
.interpretacion{
  color:#eadbd4;
  font-size:15px;
  line-height:1.65;
  text-align:left;
}
.nueva{
  display:block;
  margin:25px auto 0;
  padding:14px 25px;
  background:#8c1932;
}
footer{
  text-align:center;
  padding:25px 10px;
  color:#987c83;
  font-size:12px;
  letter-spacing:1px;
}
@media(max-width:500px){
  header{padding-top:35px}
  .seccion{padding:20px 13px}
  .botones{gap:7px}
  button{font-size:13px;padding:13px 5px}
}
</style>
</head>

<body>

<header>
  <h1>UNIVERSO PUNDARIKE</h1>
  <p>EL LENGUAJE SIMBÓLICO DEL TAROT • ASTROLOGÍA</p>
</header>

<main>

<div class="intro">
  Un espacio para explorar los símbolos del tarot, reflexionar
  sobre tus preguntas y descubrir nuevas perspectivas.
</div>

<section class="seccion">
  <h2>✧ TAROT GENERAL ✧</h2>
  <input class="pregunta" id="preguntaGeneral"
    placeholder="Escribí tu pregunta (opcional)">
  <div class="botones">
    <button onclick="realizarTirada('general',1)">UNA CARTA</button>
    <button onclick="realizarTirada('general',3)">TRES CARTAS</button>
    <button onclick="realizarTirada('general',10)">DIEZ CARTAS</button>
  </div>
</section>

<section class="seccion">
  <h2>♡ TAROT DEL AMOR ♡</h2>
  <input class="pregunta" id="preguntaAmor"
    placeholder="Escribí tu pregunta sobre el amor (opcional)">
  <div class="botones">
    <button onclick="realizarTirada('amor',1)">UNA CARTA</button>
    <button onclick="realizarTirada('amor',3)">TRES CARTAS</button>
    <button onclick="realizarTirada('amor',10)">DIEZ CARTAS</button>
  </div>
</section>

<section id="resultado">
  <h2 class="tituloResultado" id="tituloResultado"></h2>
  <div class="preguntaMostrada" id="preguntaMostrada"></div>
  <div class="cartas" id="cartas"></div>
  <button class="nueva" onclick="ocultarResultado()">NUEVA CONSULTA</button>
</section>

</main>

<footer>UNIVERSO PUNDARIKO · TAROT SIMBÓLICO</footer>

<script>
// ARCANOS MAYORES
const mayores = [
["EL LOCO","El comienzo de un camino, libertad, espontaneidad y apertura a lo desconocido.","La impulsividad, la falta de dirección o el temor a dar un paso."],
["EL MAGO","La iniciativa, la creatividad y la capacidad de transformar las ideas en acciones.","La dispersión, la manipulación o el potencial que todavía no se utiliza."],
["LA SACERDOTISA","La intuición, el mundo interior, la observación y aquello que necesita tiempo para revelarse.","La desconexión de la intuición, los secretos o la dificultad para escuchar el propio interior."],
["LA EMPERATRIZ","La fertilidad simbólica, la abundancia, el cuidado y la expresión creativa.","El descuido personal, la dependencia o la creatividad bloqueada."],
["EL EMPERADOR","La estructura, los límites, la estabilidad y la capacidad de organizar.","La rigidez, el exceso de control o la dificultad para flexibilizar."],
["EL SUMO SACERDOTE","La tradición, el aprendizaje, los valores y la búsqueda de orientación.","El cuestionamiento de las reglas, las creencias limitantes o la necesidad de encontrar un camino propio."],
["LOS ENAMORADOS","La elección consciente, los vínculos y la coherencia entre sentimientos y decisiones.","La indecisión, los conflictos de valores o la falta de claridad afectiva."],
["EL CARRO","La determinación, el movimiento y la voluntad de avanzar hacia un objetivo.","La falta de dirección, los impulsos contradictorios o el avance sin reflexión."],
["LA FUERZA","El coraje sereno, la paciencia y el dominio consciente de los impulsos.","La inseguridad, el agotamiento o la dificultad para regular las emociones."],
["EL ERMITAÑO","La introspección, la prudencia y la búsqueda de respuestas en el interior.","El aislamiento excesivo, el miedo al contacto o la resistencia a pedir ayuda."],
["LA RUEDA DE LA FORTUNA","Los ciclos, los cambios y las oportunidades de transformación.","La resistencia al cambio o la sensación de estar repitiendo un ciclo."],
["LA JUSTICIA","El equilibrio, la responsabilidad y las consecuencias de las decisiones.","La falta de equilibrio, la negación de responsabilidades o una mirada parcial."],
["EL COLGADO","La pausa, la entrega y la posibilidad de observar una situación desde otro ángulo.","El estancamiento, el sacrificio innecesario o la resistencia a cambiar de perspectiva."],
["LA MUERTE","El cierre de una etapa, la transformación y el espacio para lo nuevo.","La resistencia a soltar, el apego al pasado o los cambios postergados."],
["LA TEMPLANZA","La armonía, la moderación y la integración de aspectos diferentes.","Los excesos, la impaciencia o la dificultad para encontrar un punto medio."],
["EL DIABLO","Los deseos, los apegos y el reconocimiento de aquello que condiciona.","La posibilidad de reconocer dependencias, recuperar autonomía y cuestionar ataduras."],
["LA TORRE","La ruptura de estructuras, las revelaciones y la transformación de lo que ya no sostiene.","El temor al cambio, la tensión acumulada o la resistencia a reconocer una realidad."],
["LA ESTRELLA","La esperanza, la inspiración y la recuperación de la confianza.","El desaliento, la pérdida de inspiración o la dificultad para reconocer recursos propios."],
["LA LUNA","El inconsciente, la sensibilidad y aquello que todavía no se comprende del todo.","La confusión que comienza a disiparse o el reconocimiento de temores e ilusiones."],
["EL SOL","La claridad, la vitalidad, la alegría y la expresión auténtica.","La dificultad para disfrutar, el exceso de exposición o el optimismo poco realista."],
["EL JUICIO","La revisión del pasado, el despertar y una nueva comprensión de la experiencia.","La autocrítica excesiva, la resistencia a revisar decisiones o asuntos pendientes."],
["EL MUNDO","La integración, la culminación de un proceso y la sensación de totalidad.","Los ciclos inconclusos, la falta de cierre o la dificultad para reconocer los avances."]
];

// ARCANOS MENORES
const palos = [
{
 nombre:"BASTOS", simbolo:"🔥",
 tema:"la energía, la iniciativa, la creatividad y los proyectos",
 amor:"la pasión, la atracción y la iniciativa afectiva"
},
{
 nombre:"COPAS", simbolo:"♡",
 tema:"las emociones, la sensibilidad y los vínculos",
 amor:"los sentimientos, la conexión emocional y la intimidad"
},
{
 nombre:"ESPADAS", simbolo:"⚔",
 tema:"los pensamientos, la comunicación y las decisiones",
 amor:"el diálogo, las dudas, los conflictos y la claridad emocional"
},
{
 nombre:"OROS", simbolo:"✧",
 tema:"los recursos, la estabilidad y los asuntos materiales",
 amor:"la construcción de confianza, la seguridad y el compromiso"
}
];

const rangos = [
["AS","un comienzo, una oportunidad y una energía que empieza a manifestarse","una oportunidad que necesita atención o un comienzo que todavía no encuentra su cauce"],
["DOS","una elección, una dualidad y la búsqueda de equilibrio","la indecisión, la tensión entre dos caminos o la dificultad para armonizar"],
["TRES","el crecimiento, la colaboración y los primeros resultados","la falta de coordinación, los retrasos o la necesidad de revisar un proyecto"],
["CUATRO","la estabilidad, la consolidación y una pausa necesaria","el estancamiento, la rigidez o una estabilidad que necesita renovarse"],
["CINCO","el desafío, el cambio de perspectiva y el aprendizaje a través de la dificultad","el conflicto, la resistencia o la dificultad para aceptar una transición"],
["SEIS","el avance, la recuperación y el intercambio equilibrado","el apego al pasado, la falta de reciprocidad o un avance que requiere revisión"],
["SIETE","la perseverancia, la evaluación y la defensa de lo importante","la inseguridad, la dispersión o la necesidad de revisar una estrategia"],
["OCHO","el movimiento, la práctica y el desarrollo de una situación","los retrasos, la falta de dirección o el exceso de actividad"],
["NUEVE","la experiencia, la madurez y la fortaleza adquirida","el agotamiento, la desconfianza o la dificultad para bajar la guardia"],
["DIEZ","la culminación de un ciclo y la integración de sus aprendizajes","una carga excesiva, un cierre pendiente o la necesidad de soltar responsabilidades"],
["SOTA","la curiosidad, el aprendizaje y la aparición de nuevas ideas","la inmadurez, la falta de constancia o la dificultad para expresar lo que se piensa"],
["CABALLERO","el impulso, la búsqueda y el movimiento decidido","la precipitación, la inconstancia o la acción sin suficiente reflexión"],
["REINA","la comprensión, la sensibilidad y el dominio de la propia energía","la inseguridad, el desequilibrio emocional o la dificultad para cuidar los propios límites"],
["REY","el dominio, la responsabilidad y la capacidad de conducir una situación","la rigidez, el exceso de autoridad o la dificultad para escuchar otras perspectivas"]
];

const cartasMazo = [];

mayores.forEach((m,i)=>{
  cartasMazo.push({
    nombre:m[0],
    simbolo:"✧",
    mayor:true,
    derecho:m[1],
    invertido:m[2]
  });
});

palos.forEach(p=>{
  rangos.forEach(r=>{
    cartasMazo.push({
      nombre:r[0]+" DE "+p.nombre,
      simbolo:p.simbolo,
      mayor:false,
      derecho:r[1],
      invertido:r[2],
      tema:p.tema,
      amor:p.amor
    });
  });
});

const posicionesTres = [
  "PASADO",
  "PRESENTE",
  "FUTURO"
];

const posicionesDiez = [
  "SITUACIÓN ACTUAL",
  "DESAFÍO",
  "RAÍZ DE LA SITUACIÓN",
  "PASADO RECIENTE",
  "OBJETIVO CONSCIENTE",
  "FUTURO PRÓXIMO",
  "TU POSICIÓN",
  "ENTORNO E INFLUENCIAS",
  "DESEOS Y TEMORES",
  "TENDENCIA FINAL"
];

function mezclar(array){
  const copia=[...array];
  for(let i=copia.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copia[i],copia[j]]=[copia[j],copia[i]];
  }
  return copia;
}

function interpretar(carta, amor, invertida){
  let texto = invertida ? carta.invertido : carta.derecho;

  if(!carta.mayor){
    texto += ". Esta carta se expresa a través de "+
      (amor ? carta.amor : carta.tema)+".";
  }

  if(amor){
    texto += " En el plano afectivo, invita a observar los sentimientos, "+
      "las formas de vincularse y las necesidades emocionales presentes.";
  }else{
    texto += " En tu situación, propone observar las circunstancias, "+
      "tus decisiones y las posibilidades de aprendizaje.";
  }

  texto += " No representa un destino inevitable, sino una invitación "+
    "a reflexionar sobre el momento y tus propias elecciones.";

  return texto;
}

function realizarTirada(tipo,cantidad){
  const amor=tipo==="amor";
  const pregunta=document.getElementById(
    amor ? "preguntaAmor" : "preguntaGeneral"
  ).value.trim();

  const seleccionadas=mezclar(cartasMazo).slice(0,cantidad);
  const resultado=document.getElementById("resultado");
  const contenedor=document.getElementById("cartas");

  document.getElementById("tituloResultado").textContent =
    (amor ? "TAROT DEL AMOR" : "TAROT GENERAL")+
    (cantidad===10 ? " · CRUZ CELTA" : "");

  document.getElementById("preguntaMostrada").textContent =
    pregunta ? "Tu consulta: "+pregunta : "Lectura simbólica";

  contenedor.innerHTML="";

  seleccionadas.forEach((carta,i)=>{
    const invertida=Math.random()<0.30;
    let posicion="TU CARTA";

    if(cantidad===3) posicion=posicionesTres[i];
    if(cantidad===10) posicion=posicionesDiez[i];

    const caja=document.createElement("article");
    caja.className="carta";

    const numero=document.createElement("div");
    numero.className="numero";
    numero.textContent="ARCANO "+String(i+1).padStart(2,"0");

    const simbolo=document.createElement("div");
    simbolo.className="simbolo";
    simbolo.textContent=carta.simbolo;
    if(invertida) simbolo.style.transform="rotate(180deg)";

    const nombre=document.createElement("div");
    nombre.className="nombreCarta";
    nombre.textContent=carta.nombre;

    const orientacion=document.createElement("div");
    orientacion.className="orientacion";
    orientacion.textContent=invertida ? "INVERTIDA" : "DERECHA";

    const pos=document.createElement("div");
    pos.className="posicion";
    pos.textContent=posicion;

    const interpretacion=document.createElement("div");
    interpretacion.className="interpretacion";
    interpretacion.textContent=interpretar(carta,amor,invertida);

    caja.append(numero,simbolo,nombre,orientacion,pos,interpretacion);
    contenedor.appendChild(caja);
  });

  resultado.style.display="block";
  resultado.scrollIntoView({behavior:"smooth",block:"start"});
}

function ocultarResultado(){
  document.getElementById("resultado").style.display="none";
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>

</body>
</html>
